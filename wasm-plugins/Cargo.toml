[package]
name = "stellar-wasm-cache"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Bounded fail-open TTL/LRU cache for Soroban RPC state reads"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
proptest = "1.5"
